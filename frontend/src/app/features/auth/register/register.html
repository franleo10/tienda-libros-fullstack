<form [formGroup]="formulario" (ngSubmit)="alEnviar()">
    
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" formControlName="nombre">

    <label for="edad">Edad</label>
    <input type="number" formControlName="edad" id="edad">
    
    <label for="email">Email</label>
    <input type="email" formControlName="email" id="email">

    <label for="password">Contraseña</label>
    <input type="password" formControlName="password" id="password">

    <label for="confirmarPassword">Confirmar Contraseña</label>
    <input type="password" formControlName="confirmarPassword" id="confirmarPassword">
    @if (formulario.hasError('noCoinciden') && formulario.controls.confirmarPassword.touched) {
  <p>Las contraseñas no coinciden</p>
}
    
    <button type="submit" [disabled]="formulario.invalid || cargando() ">@if (cargando()) { Registrando... } @else { Registrarse }</button>


    @if (mensajeError()) {
     <p>{{ mensajeError() }}</p>
    }

    
</form>
