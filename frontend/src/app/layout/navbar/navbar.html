<nav>
<button class="hamburguesa" (click)="alternarMenu()">☰</button>
<div class="links" [class.abierto]="menuAbierto()">
@if(sesionIniciada()){

    <a routerLink="/libros">Libros</a>
    <a routerLink="/autores">Autores</a>
    <a routerLink="/carrito">Carrito</a>
    <a routerLink="/mi-biblioteca">Biblioteca</a>
    <a routerLink="/compras">Mis compras</a>
    <a routerLink="/perfil">Perfil</a>

@if(esAdmin()){
    <div class="admin">
      <button
        type="button"
        class="admin-toggle"
        aria-haspopup="true"
        aria-controls="menu-admin"
        [attr.aria-expanded]="adminAbierto()"
        (click)="alternarAdmin()"
      >
        Admin <span class="flecha" aria-hidden="true">▾</span>
      </button>
      @if(adminAbierto()){
        <div class="admin-menu" id="menu-admin" (click)="cerrarMenus()">
          @if(puedeAdministrarLibros()){
            <a routerLink="/admin/libros">Libros</a>
          }
          @if(puedeAgregarAutores()){
            <a routerLink="/admin/autores/nuevo">Nuevo autor</a>
          }
          @if(puedeAdministrarUsuarios()){
            <a routerLink="/admin/usuarios">Usuarios</a>
          }
        </div>
      }
    </div>
}

    <button class="salir" (click)="salir()">Salir</button>
}@else{

    <a routerLink="/registro">Registrarse</a>
    <a routerLink="/login">Iniciar Sesion</a>

}
</div>
</nav>
